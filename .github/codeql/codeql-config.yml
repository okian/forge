name: forge

# testdata holds packages that do not compile, on purpose: a type error the
# loader has to report, a declaration whose generated half does not exist yet,
# an instantiation cycle the subject builder must refuse. The go tool never
# builds them — `go build ./...` skips any directory named testdata — but
# CodeQL's extractor finds them anyway and type-checks each one on its own,
# turning every fixture into a build error logged against a job that then
# passes. Nothing under testdata is compiled into the module or shipped, so
# there is no analysis to lose by leaving it out.
paths-ignore:
  - "**/testdata/**"

# This module's risk is as much correctness as it is security, so the quality
# queries run alongside the security ones.
queries:
  - uses: security-and-quality
