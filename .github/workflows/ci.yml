name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a pull request run is a saving; superseding a main-branch run
  # would drop the only signal a merged commit ever gets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting and linting share a job because they share an expensive install:
  # one pinned golangci-lint binary answers both. The step names keep the two
  # signals apart, and the second runs even when the first has failed, so one
  # push reports every complaint rather than the first one.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The version lives in the Makefile so that the linter CI runs and the
      # linter a contributor runs cannot drift apart.
      - name: read the pinned version
        id: pin
        run: echo "golangci=$(make -s golangci-version)" >> "$GITHUB_OUTPUT"

      - name: cache golangci-lint
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.pin.outputs.golangci }}

      - name: install golangci-lint
        if: steps.cache.outputs.cache-hit != 'true'
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.pin.outputs.golangci }}"

      - name: format
        run: make fmt-check

      - name: lint
        if: ${{ !cancelled() }}
        run: make lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: build
        run: go build ./...

      - name: go vet
        run: make vet

      - name: test
        run: make test

      - name: coverage floor
        run: make cover

      # One profile is enough to read, and the two runners produce the same one.
      - name: upload coverage profile
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: test under the race detector
        run: make race

  # Generated code has to compile wherever the subject's package does, and the
  # loader walks paths. Building for each platform is the cheap half of that
  # promise; the test matrix above covers the half that needs a real filesystem.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go.mod and go.sum are tidy
        run: make tidy-check

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: read the pinned version
        id: pin
        run: echo "govulncheck=$(make -s govulncheck-version)" >> "$GITHUB_OUTPUT"

      - name: install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${{ steps.pin.outputs.govulncheck }}"

      - name: report reachable vulnerabilities
        run: make vuln

  # One job to require in a branch protection rule, so that adding a job above
  # does not mean remembering to add it to the rule as well. A dependency that
  # was skipped or cancelled is not a pass.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [lint, test, race, build, tidy, vuln]
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job reported ${result}" >&2
              exit 1
            fi
          done
