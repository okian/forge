name: codeql

# This replaces code scanning's default setup rather than sitting beside it —
# GitHub refuses results from an advanced configuration while the default one is
# enabled. What the advanced form buys is a configuration that lives in the tree
# where it can be reviewed, and the security-and-quality query pack rather than
# security alone: this module's risk is as much correctness as it is security.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The pack keeps growing, so a pattern only recognised as a problem after a
  # commit landed is still found.
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The module itself. Built by hand rather than by autobuild, which
          # discovers modules by walking for go.mod and finds thirteen: the
          # module, and twelve fixture modules under testdata that do not
          # compile on purpose. `go build ./...` finds one, because the go tool
          # does not descend into a directory named testdata.
          - language: go
            build-mode: manual
          # And the workflows, which are as much a supply chain as go.mod is.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          check-latest: true

      - name: initialise
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      # Both commands together reach what autobuild reached: `go test` compiles
      # every package and every test package, so nothing is dropped from the
      # analysis by taking the build into our own hands. `-run` matching no test
      # keeps it to compiling and linking.
      - name: build
        if: matrix.language == 'go'
        run: |
          go build ./...
          go test -run='^$' -count=1 ./...

      - name: analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
