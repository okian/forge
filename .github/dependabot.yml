version: 2

updates:
  # x/tools is the package loader forge is built on, and a Go release that
  # changes the type checker usually arrives here first.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies

  # The layer that lives here and is not part of the module above it. It reaches
  # forge through a filesystem replace, so what it has of its own is forge's
  # transitive graph written down again — which means a bump to the root moves
  # this too, and the two land in separate pull requests. Whichever arrives
  # second is red until `make tidy` reconciles both, which is one command and is
  # why this is a note rather than a mechanism.
  - package-ecosystem: gomod
    directory: "/x/csv"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies

  # Actions pinned to a major tag still move underneath a workflow. This makes
  # the move a pull request that CI runs against.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
